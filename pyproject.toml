[project]
name = "commit-rewriter"
version = "0.1.0"
description = "A local web UI for editing Git commit messages safely"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["starlette>=0.47,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
commit-rewriter = "commit_rewriter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["commit_rewriter"]
