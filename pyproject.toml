[project]
name = "commit-rewriter"
version = "0.1"
description = "Local web app for editing local commit messages to a Git repository"
readme = "README.md"
authors = [{name = "Simon Willison"}]
requires-python = ">=3.11"
dependencies = ["starlette>=0.47,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/simonw/commit-rewriter"
Changelog = "https://github.com/simonw/commit-rewriter/releases"
Issues = "https://github.com/simonw/commit-rewriter/issues"
CI = "https://github.com/simonw/commit-rewriter/actions"

[project.scripts]
commit-rewriter = "commit_rewriter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["commit_rewriter"]

[tool.setuptools.package-data]
commit_rewriter = ["index.html", "app.js"]
